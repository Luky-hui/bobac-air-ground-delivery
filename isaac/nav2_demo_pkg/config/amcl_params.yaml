amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /laser_scan_fuse
    robot_model_type: "nav2_amcl::OmniMotionModel"
    tf_broadcast: true
    transform_tolerance: 1.0
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    laser_model_type: "likelihood_field"
    max_beams: 120
    laser_max_range: 10.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      x: 1.60
      y: 0.26
      z: 0.0
      yaw: 0.05
    initial_cov_xx: 0.04
    initial_cov_yy: 0.04
    initial_cov_aa: 0.02
