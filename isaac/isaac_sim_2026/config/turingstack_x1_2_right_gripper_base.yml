##
## This is for grasp reachability analysis. It uses gripper01_base as the end-effector,
## while the currently controlled DOF remain joint1_R..joint6_R. The torso joint "body"
## is locked at 0.0 to match the current controller interface.
##

robot_cfg:
  kinematics:
    usd_path: null
    usd_robot_root: "/robot"
    isaac_usd_path: ""
    usd_flip_joints: {}
    usd_flip_joint_limits: []

    urdf_path: "/home/u-zhuang/ros2_ws/src/isaac/isaac_sim_2026/config/TuringStack_X1_2.urdf"
    asset_root_path: "/home/u-zhuang/ros2_ws/src/isaac/isaac_sim_2026/config"

    base_link: "base_link"
    ee_link: "gripper01_base"
    link_names: null
    lock_joints:
      body: 0.0
    extra_links: null

    collision_link_names:
      - "link1_R"
      - "link2_R"
      - "link3_R"
      - "link4_R"
      - "link5_R"
      - "link6_R"
      - "link7_R"
      - "gripper01_base"

    collision_spheres:
      link1_R:
        - center: [0.0, 0.0, 0.0]
          radius: 0.025
        - center: [0.0, 0.0, 0.04]
          radius: 0.025
      link2_R:
        - center: [0.0, 0.0, 0.0]
          radius: 0.022
        - center: [0.0, -0.055, 0.0]
          radius: 0.020
      link3_R:
        - center: [0.0, 0.0, 0.0]
          radius: 0.020
        - center: [0.0, 0.0, 0.05]
