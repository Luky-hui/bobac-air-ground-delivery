      link5_R:
        - center: [0.0, 0.0, 0.0]
          radius: 0.018
      link6_R:
        - center: [0.0, 0.0, 0.0]
          radius: 0.016
        - center: [0.0, 0.0, 0.03]
          radius: 0.016
      link7_R:
        - center: [0.0, 0.0, 0.0]
          radius: 0.018
      gripper01_base:
        - center: [0.0, 0.0, 0.0]
