      link7_R: ["link5_R", "link6_R", "gripper01_base"]
      gripper01_base: ["link6_R", "link7_R"]

    self_collision_buffer:
      link1_R: 0.00
      link2_R: 0.00
      link3_R: 0.00
      link4_R: 0.00
      link5_R: 0.00
      link6_R: 0.00
      link7_R: 0.00
      gripper01_base: 0.00

    use_global_cumul: True
    mesh_link_names: []

    cspace:
